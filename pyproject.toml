[project]
name = "agora"
version = "0.1.0"
description = "Agora: a local stock-strategy lab (backtests and paper trading, no real money)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "yfinance==1.7.0",
    "pandas>=3.0.6",
    "pandas-market-calendars>=5.5.0",
    "restrictedpython>=8.5",
    "numpy>=2.5.4",
    "pystray>=0.19.5",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "live: needs real network (Yahoo, NSE, Stooq, Ollama); runs only on the user's laptop",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*" = ["E501"]
"backend/indicators/catalog.py" = ["E501"]  # a table of plain-English descriptions
"backend/analysis/candles_world.py" = ["E501"]  # a table of plain-English meanings
"backend/analysis/setups.py" = ["E501"]  # a table of plain-English meanings
"backend/strategy/templates.py" = ["E501"]  # a table of starter strategies
"backend/db/seed.py" = ["E501"]  # the charge-rate table
"backend/metrics/summary.py" = ["E501"]  # plain-English sentences
"backend/kairos/tools/*" = ["E501"]  # plain-English results and tool descriptions
"backend/kairos/prompts.py" = ["E501"]  # the persona text
"backend/metis/think.py" = ["E501"]  # Metis's persona text
"backend/kairos/router.py" = ["E501"]  # a table of request patterns

[tool.mypy]
strict = true
python_version = "3.12"
files = ["backend"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pandas_market_calendars", "RestrictedPython", "RestrictedPython.*", "pystray", "pystray.*"]
ignore_missing_imports = true
